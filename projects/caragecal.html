<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Age Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        input, button {
            margin: 10px;
            padding: 10px;
            width: 90%;
        }
        button {
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Car Age Calculator</h2>
        <label for="carYear">Enter Car Manufacturing Year:</label>
        <input type="number" id="carYear" placeholder="e.g., 2010">
        <button onclick="calculateCarAge()">Calculate Age</button>
        <h3 id="result"></h3>
    </div>

    <script>
        class Car {
            constructor(year) {
                this.year = year;
            }

            getAge(currentYear) {
                return currentYear - this.year;
            }
        }

        function calculateCarAge() {
            let carYear = document.getElementById("carYear").value;
            let currentYear = new Date().getFullYear();

            if (carYear === "" || carYear > currentYear || carYear < 1886) {
                document.getElementById("result").innerText = "Please enter a valid year.";
                return;
            }

            let myCar = new Car(parseInt(carYear));
            let ageOfCar = myCar.getAge(currentYear);

            document.getElementById("result").innerText = `The car is ${ageOfCar} years old.`;
        }
    </script>

</body>
</html>
