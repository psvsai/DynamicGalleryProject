<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Pattern Generator ✨</title>
    <style>
        /* Background Styling */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            color: #2c3e50;
            text-align: center;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Main Container */
        .container {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }

        /* Input Field */
        input {
            width: 60px;
            padding: 10px;
            font-size: 18px;
            text-align: center;
            border: none;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease-in-out;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.5);
            color: #34495e;
        }

        /* Label */
        label {
            font-size: 18px;
            font-weight: bold;
        }

        /* Star Pattern Output */
        .stars {
            font-family: monospace;
            white-space: pre;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.3);
            color: #2c3e50;
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>✨ Star Pattern Generator ✨</h2>
        <label for="numInput">Enter a positive number:</label>
        <input type="number" id="numInput" min="1" max="20" value="" oninput="generateStars()">
        <pre class="stars" id="starOutput"></pre>
    </div>

    <script>
        function generateStars() {
            let num = document.getElementById("numInput").value;
            let output = "";
            for (let i = 1; i <= num; i++) {
                output += "* ".repeat(i) + "\n";
            }
            document.getElementById("starOutput").textContent = output;
        }
    </script>

</body>
</html>
