<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Pattern Generator ✨</title>
    <style>
        /* Background Styling */
        body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to right, #4b502c, #24282b);
    color: white;
    text-align: center;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

input, #demo {
    width: 80%;
    padding: 12px;
    font-size: 18px;
    border-radius: 6px;
    text-align: center;
    transition: 0.3s;
}

input { border: none; outline: none; }

input:focus { background: rgba(255, 255, 255, 0.2); color: white; }

#demo {
    font-weight: bold;
    margin-top: 15px;
    background: rgba(255, 255, 255, 0.2);
    min-height: 50px;
}



    </style>
</head>
<body>

    <div class="container">
        <h2>✨ Star Pattern Generator ✨</h2>
        <label for="numInput">Enter a positive number:</label>
        <input type="number" id="numInput" min="1" max="20" value="" oninput="generateStars()">
        <pre class="stars" id="starOutput"></pre>
    </div>

    <script>
        function generateStars() {
            let num = document.getElementById("numInput").value;
            let output = "";
            for (let i = 1; i <= num; i++) {
                output += "* ".repeat(i) + "\n";
            }
            document.getElementById("starOutput").textContent = output;
        }
    </script>

</body>
</html>
