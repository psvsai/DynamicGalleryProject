<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Pattern Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: left;
            padding: 20px;
        }
        input {
            width: 50px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .stars {
            font-family: monospace;
            white-space: pre;
        }
    </style>
</head>
<body>
    <label for="numInput">Enter a positive number:</label>
    <input type="number" id="numInput" min="1" max="20" value="" oninput="generateStars()">
    <pre class="stars" id="starOutput"></pre>

    <script>
        function generateStars() {
            let num = document.getElementById("numInput").value;
            let output = "";
            for (let i = 1; i <= num; i++) {
                output += "* ".repeat(i) + "\n";
            }
            document.getElementById("starOutput").textContent = output;
        }

        // Generate stars initially
        generateStars();
    </script>
</body>
</html>
