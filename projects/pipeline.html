<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Pipeline Manager</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #f6d365, #fda085);
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            width: 350px;
        }

        h3 {
            color: #333;
            margin-bottom: 15px;
        }

        input {
            width: 90%;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            text-align: center;
        }

        input:focus {
            border-color: #ff7e5f;
        }

        .buttons {
            margin-top: 15px;
        }

        button {
            background: #ff7e5f;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }

        button:hover {
            background: #ea5c44;
        }

        .pipeline {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #444;
        }
    </style>

    <script>
        let taskStack = [];

        function addTask() {
            let taskInput = document.getElementById("task_input");
            let taskName = taskInput.value.trim();

            if (taskName !== "") {
                taskStack.push(taskName);
                taskInput.value = "";
                updatePipeline();
            }
        }

        function undoTask() {
            if (taskStack.length > 0) {
                taskStack.pop();
                updatePipeline();
            }
        }

        function updatePipeline() {
            let pipeline = document.getElementById("task_pipeline");

            if (taskStack.length > 0) {
                // Join all tasks with an arrow separator
                pipeline.innerHTML = taskStack.join(" , ");
            } else {
                // Display message when no tasks are present
                pipeline.innerHTML = "No tasks in pipeline";
            }
        }
    </script>
</head>

<body>
    <div class="container">
        <h3>Process Line</h3>
        <input type="text" id="task_input" placeholder="Enter Task Name" />
        <div class="buttons">
            <button onclick="addTask()">Add Task</button>
            <button onclick="undoTask()">Undo Task</button>
        </div>
        <div class="pipeline" id="task_pipeline">No tasks in pipeline</div>
    </div>
</body>
</html>
