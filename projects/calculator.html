<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #6dd5ed, #2193b0);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Calculator Container */
        #container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 400px;
        }

        /* Input Fields */
        input {
            width: calc(100% - 20px);
            padding: 12px;
            margin: 10px 0;
            font-size: 18px;
            border: 2px solid #3498db;
            border-radius: 5px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2c3e50;
        }

        input[disabled] {
            background: #ecf0f1;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Buttons */
        .button_div {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            width: 180px;
            padding: 12px;
            margin: 8px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 10px rgba(255, 126, 95, 0.3);
        }

        button:hover {
            background: linear-gradient(90deg, #ff5733, #ff8c42);
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(255, 87, 51, 0.4);
        }
    </style>
</head>
<body>

    <div id="container">
        <h2>Simple Calculator</h2>
        <div class="input_div">
            <input type="number" placeholder="Enter the value of X" id="num1"/>
            <input type="number" placeholder="Enter the value of Y" id="num2"/>
            <input type="text" placeholder="Result will appear here" id="res" disabled/>
        </div>

        <div class="button_div">
            <button onclick="add()">Addition (X + Y)</button>
            <button onclick="sub()">Subtraction (X - Y)</button>
            <button onclick="mul()">Multiplication (X * Y)</button>
            <button onclick="div()">Division (X / Y)</button>
        </div>           
    </div>

    <script>
        function add() {
            let x = parseFloat(document.getElementById("num1").value);
            let y = parseFloat(document.getElementById("num2").value);
            document.getElementById("res").value = x + y;
        }

        function sub() {
            let x = parseFloat(document.getElementById("num1").value);
            let y = parseFloat(document.getElementById("num2").value);
            document.getElementById("res").value = x - y;
        }

        function mul() {
            let x = parseFloat(document.getElementById("num1").value);
            let y = parseFloat(document.getElementById("num2").value);
            document.getElementById("res").value = x * y;
        }

        function div() {
            let x = parseFloat(document.getElementById("num1").value);
            let y = parseFloat(document.getElementById("num2").value);
            if (y === 0) {
                alert("Division by zero is not allowed.");
                return;
            }
            document.getElementById("res").value = x / y;
        }
    </script>

</body>
</html>
