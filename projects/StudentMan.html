<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background-color: #f4f4f4;
        }
        h2 {
            color: #333;
        }
        .container {
            width: 60%;
            margin: auto;
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        input {
            width: 45%;
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .button-container {
            margin-top: 10px;
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
        .insert-btn { background-color: #0d0d0d; color: white; }
        .clear-btn { background-color: #0a0909; color: white; }
        .show-btn { background-color: #080909; color: white; }
        .display-btn { background-color: #070707; color: white; }
        #output {
            margin-top: 20px;
            text-align: left;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Information</h2>
        <input type="text" id="name" placeholder="Enter Name">
        <input type="number" id="age" placeholder="Enter Age"><br>
        <input type="text" id="course" placeholder="Enter Course">
        <input type="text" id="major" placeholder="Enter Major"><br>

        <div class="button-container">
            <button class="insert-btn" onclick="insertStudent()">Insert Info</button>
            <button class="clear-btn" onclick="clearInputs()">Clear Inputs</button>
            <button class="show-btn" onclick="showAllStudents()">Show All</button>
            <button class="display-btn" onclick="clearDisplay()">Clear Display</button>
        </div>

        <h3>Search Student</h3>
        <input type="text" id="searchInput" placeholder="Search by Name or Major" oninput="searchStudent()">

        <h3>Student List</h3>
        <div id="output"></div>
    </div>

    <script>
        let students = [];

        function insertStudent() {
            let student = {
                name: document.getElementById("name").value,
                age: document.getElementById("age").value,
                course: document.getElementById("course").value,
                major: document.getElementById("major").value
            };

            students.push(student);
            clearInputs();
            searchStudent(); 
        }

        function showAllStudents() {
            let outputDiv = document.getElementById("output");
            outputDiv.innerHTML = "";

            if (students.length === 0) {
                outputDiv.innerHTML = "No student information available.";
                return;
            }

            students.forEach((student, index) => {
                outputDiv.innerHTML += `<p>${index + 1}. ${student.name}, Age: ${student.age}, ${student.course}, ${student.major}</p>`;
            });
        }

        function searchStudent() {
            let searchValue = document.getElementById("searchInput").value.toLowerCase();
            let outputDiv = document.getElementById("output");
            outputDiv.innerHTML = "";

            if (!searchValue) {
                showAllStudents(); 
                return;
            }

            let filteredStudents = students.filter(student =>
                student.name.toLowerCase().includes(searchValue) ||
                student.major.toLowerCase().includes(searchValue)
            );

            if (filteredStudents.length === 0) {
                outputDiv.innerHTML = "No matching students found.";
                return;
            }

            filteredStudents.forEach((student, index) => {
                outputDiv.innerHTML += `<p>${index + 1}. ${student.name}, Age: ${student.age}, ${student.course}, ${student.major}</p>`;
            });
        }

        function clearInputs() {
            document.getElementById("name").value = "";
            document.getElementById("age").value = "";
            document.getElementById("course").value = "";
            document.getElementById("major").value = "";
        }

        function clearDisplay() {
            document.getElementById("output").innerHTML = "";
        }
    </script>
</body>
</html>
