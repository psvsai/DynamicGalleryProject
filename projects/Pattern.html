<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Pattern Generator</title>
    <style>
        /* Background Styling */
   body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to right, #8e44ad, #3498db);
    color: white;
    text-align: center;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

input, #demo {
    width: 80%;
    padding: 12px;
    font-size: 18px;
    border-radius: 6px;
    text-align: center;
    transition: 0.3s;
}

input { border: none; outline: none; }

input:focus { background: rgba(255, 255, 255, 0.2); color: white; }

#demo {
    font-weight: bold;
    margin-top: 15px;
    background: rgba(255, 255, 255, 0.2);
    min-height: 50px;
}


    </style>
</head>
<body>

    <div class="container">
        <h2>✨ Star Pattern Generator ✨</h2>
        <input type="number" min="1" placeholder="Enter a positive number" id="number" oninput="generateStars()">
        <div id="demo"></div>
    </div>

    <script>
        const colors = ["#ff4757", "#2ed573", "#1e90ff", "#fbc531", "#e056fd"];
        let colorIndex = 0;

        function generateStars() {
            let input = document.getElementById("number").value;
            let output = "";

            for (let i = 1; i <= input; i++) {
                output += "* ".repeat(i) + "<br>";
            }

            let demoDiv = document.getElementById("demo");
            demoDiv.innerHTML = output;

            // Change color in a cyclic manner
            demoDiv.style.color = colors[colorIndex];
            colorIndex = (colorIndex + 1) % colors.length;
        }
    </script>

</body>
</html>
